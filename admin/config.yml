backend:
  name: github
  repo: felixbollen/felixbollen-site
  branch: main
  commit_messages:
    update: "Update {{collection}} “{{slug}}”"
    create: "Add {{collection}} “{{slug}}”"
    delete: "Remove {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

site_url: https://felixbollen.com
display_url: https://felixbollen.com
logo_url: https://felixbollen.com/favicon.svg
locale: en

media_folder: static/media
show_preview_links: true
search: false
public_folder: /media

collections:
  - name: home
    label: Homepage
    files:
      - name: home
        label: Homepage
        file: content/home.json
        format: json
        fields:
          - {name: title, label: "Browser tab title", widget: string}
          - {name: description, label: "Google description", widget: text}
          - {name: name, label: "Name (big heading)", widget: string}
          - {name: intro, label: "Intro text", widget: text}
          - name: disciplines
            label: Disciplines
            widget: list
            summary: "{{fields.title}}"
            fields:
              - {name: title, label: Title, widget: string}
              - {name: text, label: Text, widget: text}
              - {name: items, label: "Bullet points", widget: list, field: {name: item, label: Item, widget: string}}
          - name: numbers
            label: "In numbers"
            widget: list
            summary: "{{fields.figure}} – {{fields.label}}"
            fields:
              - {name: figure, label: Figure, widget: string}
              - {name: label, label: Label, widget: string}
          - name: also
            label: "Also (other work)"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - {name: name, label: Name, widget: string}
              - {name: text, label: Text, widget: text}
              - {name: tag, label: Tag, widget: string, required: false}
          - {name: about_heading, label: "About heading", widget: text}
          - {name: about_image, label: "About photo", widget: image, required: false}
          - {name: about_image_alt, label: "About photo description", widget: string, required: false}
          - {name: about, label: "About paragraphs", widget: list, field: {name: p, label: Paragraph, widget: text}}
          - name: details
            label: "About details"
            widget: list
            summary: "{{fields.label}}"
            fields:
              - {name: label, label: Label, widget: string}
              - {name: value, label: Value, widget: string}
          - {name: contact_heading, label: "Contact heading (new line = line break)", widget: text}
          - {name: contact_text, label: "Contact text", widget: text}
          - {name: email, label: "Email address", widget: string}

  - name: press
    label: "Press pages"
    files:
      - name: gleisgarten
        label: "Gleis//Garten press"
        file: content/press-gleisgarten.json
        format: json
        fields:
          - {name: title, label: "Browser tab title", widget: string}
          - {name: heading, label: Heading, widget: string}
          - {name: intro, label: Intro, widget: text}
          - {name: contact, label: "Contact line", widget: string}
          - {name: project, widget: hidden}
          - name: items
            label: Articles
            label_singular: article
            widget: list
            summary: "{{fields.date}} – {{fields.outlet}}"
            hint: "Newest first. Drag to reorder."
            fields:
              - {name: outlet, label: Publication, widget: string}
              - {name: title, label: "Headline (optional)", widget: text, required: false}
              - {name: date, label: "Date (e.g. 25.6.2026)", widget: string, required: false}
              - {name: url, label: "Link to article (web address)", widget: string, required: false}
              - {name: pdf, label: "Or upload a PDF instead", widget: file, required: false}
              - {name: image, label: Image, widget: image, required: false}

      - name: germankraft
        label: "German Kraft press"
        file: content/press-germankraft.json
        format: json
        fields:
          - {name: title, label: "Browser tab title", widget: string}
          - {name: heading, label: Heading, widget: string}
          - {name: intro, label: Intro, widget: text}
          - {name: contact, label: "Contact line", widget: string}
          - {name: project, widget: hidden}
          - name: items
            label: Articles
            label_singular: article
            widget: list
            summary: "{{fields.date}} – {{fields.outlet}}"
            hint: "Newest first. Drag to reorder."
            fields:
              - {name: outlet, label: Publication, widget: string}
              - {name: title, label: "Headline (optional)", widget: text, required: false}
              - {name: reach, label: "Reach (e.g. 1.7M UMVs)", widget: string, required: false}
              - {name: date, label: "Date (e.g. 25.6.2026)", widget: string, required: false}
              - {name: url, label: "Link to article (web address)", widget: string, required: false}
              - {name: pdf, label: "Or upload a PDF instead", widget: file, required: false}
              - {name: image, label: Image, widget: image, required: false}
      - name: modelmarket
        label: "Model Market press"
        file: content/press-modelmarket.json
        format: json
        fields:
          - {name: title, label: "Browser tab title", widget: string}
          - {name: heading, label: Heading, widget: string}
          - {name: intro, label: Intro, widget: text}
          - {name: contact, label: "Contact line", widget: string}
          - {name: project, widget: hidden}
          - name: items
            label: Articles
            label_singular: article
            widget: list
            summary: "{{fields.date}} – {{fields.outlet}}"
            hint: "Newest first. Drag to reorder."
            fields:
              - {name: outlet, label: Publication, widget: string}
              - {name: title, label: "Headline (optional)", widget: text, required: false}
              - {name: reach, label: "Reach (e.g. 1.7M UMVs)", widget: string, required: false}
              - {name: date, label: "Date (e.g. 25.6.2026)", widget: string, required: false}
              - {name: url, label: "Link to article (web address)", widget: string, required: false}
              - {name: pdf, label: "Or upload a PDF instead", widget: file, required: false}
              - {name: image, label: Image, widget: image, required: false}
  - name: projects
    label: Projects
    label_singular: Project
    description: "Click a project to edit it. Changes go live about a minute after you click Publish."
    folder: content/projects
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{order}}. {{name}}"
    sortable_fields: [order, name]
    fields:
      - {name: name, label: "Project name", widget: string}
      - {name: kind, label: "What it is (e.g. Rooftop bar & brewery)", widget: string}
      - {name: city, label: City, widget: string}
      - {name: years, label: Years, widget: string, required: false}
      - {name: role, label: "My role", widget: string}
      - {name: disciplines, label: Disciplines, widget: select, multiple: true, options: ["Marketing & Sales", "Art Direction", "Graphic Design"]}
      - {name: intro, label: "Intro text", widget: text}
      - {name: credit, label: "Credit line (optional)", widget: text, required: false}
      - name: hero
        label: "Top of the page"
        widget: object
        hint: "Add a video OR an image. A video wins if both are set."
        fields:
          - {name: video, label: "Video (MP4, max ~20 MB)", widget: file, required: false}
          - {name: poster, label: "Video still (shown while the video loads)", widget: image, required: false}
          - {name: image, label: "Image", widget: image, required: false}
          - {name: slides, label: "Slideshow (Kraft Dalston)", widget: list, required: false, collapsed: true, field: {name: image, label: Image, widget: image}}
          - {name: hide_logo, label: "Hide logo over the video/image", widget: boolean, default: false, required: false}
          - {name: type, widget: hidden}
          - {name: vimeo_id, widget: hidden}
          - {name: spin_logo, widget: hidden}
          - {name: animation, widget: hidden}
      - name: sections
        label: "What I did"
        label_singular: section
        widget: list
        collapsed: true
        summary: "{{fields.type}}"
        hint: "Drag sections to reorder them. Open one to edit text and gallery."
        fields:
          - {name: type, label: Section, widget: select, options: ["Branding", "Marketing", "P.R.", "Conceptualisation", "Website", "Photography & videography"]}
          - {name: text, label: Text, widget: text}
          - name: stats
            label: "Big numbers (optional)"
            label_singular: number
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.figure}} {{fields.label}}"
            fields:
              - {name: figure, label: "Number (e.g. £3.6m)", widget: string}
              - {name: label, label: "What it means", widget: string}
          - name: images
            label: "Gallery images"
            label_singular: image
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.caption}}"
            hint: "Drag to reorder. Add image, then drag a file onto the upload box."
            fields:
              - {name: image, label: Image, widget: image}
              - {name: caption, label: Caption, widget: string, required: false}
              - {name: thumb, label: "Thumbnail (optional)", widget: image, required: false}
              - {name: scroll, label: "Open as scrollable newsletter", widget: boolean, required: false}
              - {name: bare, label: "No tile background (show whole image)", widget: boolean, required: false}
              - {name: cutout, label: "Logo or cut-out (show whole image, no crop)", widget: boolean, default: false, required: false}
          - name: videos
            label: "Gallery videos"
            label_singular: video
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.caption}}"
            fields:
              - {name: video, label: "Video (MP4)", widget: file}
              - {name: poster, label: "Still image", widget: image, required: false}
              - {name: caption, label: Caption, widget: string, required: false}
          - {name: link, label: "Button link (optional)", widget: string, required: false}
          - {name: link_label, label: "Button text", widget: string, required: false}
          - {name: pano_title, label: "360° tour title (optional)", widget: string, required: false}
          - name: pano
            label: "360° photos (optional, opens full screen)"
            label_singular: 360 photo
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.caption}}"
            fields:
              - {name: image, label: "360° image (equirectangular, 2:1)", widget: image}
              - {name: thumb, label: "Thumbnail (optional)", widget: image, required: false}
              - {name: caption, label: Caption, widget: string, required: false}
          - {name: deck_title, label: "Slide deck title (optional)", widget: string, required: false}
          - name: deck
            label: "Slide deck (optional)"
            label_singular: slide
            widget: list
            required: false
            collapsed: true
            fields:
              - {name: image, label: Slide, widget: image}
              - {name: caption, label: Caption, widget: string, required: false}
          - name: before
            label: "Before photo (shown before the 360° tour)"
            widget: object
            required: false
            collapsed: true
            fields:
              - {name: image, label: Image, widget: image, required: false}
              - {name: caption, label: Caption, widget: string, required: false}
              - {name: cta_kicker, label: "Prompt kicker", widget: string, required: false}
              - {name: cta, label: "Prompt text", widget: string, required: false}
          - {name: pres_title, label: "Presentation button title", widget: string, required: false}
          - {name: pres_pdf, label: "Presentation PDF", widget: file, required: false}
          - name: pres
            label: "Presentation slides"
            widget: list
            required: false
            collapsed: true
            fields:
              - {name: image, label: Slide, widget: image}
          - name: points
            label: "List of responsibilities"
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - {name: title, label: Title, widget: string}
              - {name: text, label: Text, widget: text, required: false}
          - {name: strip_label, label: "Logo strip label", widget: string, required: false}
          - {name: strip, label: "Logo strip image", widget: image, required: false}
          - {name: chips_label, label: "Tags label", widget: string, required: false}
          - {name: chips, label: "Tags", widget: list, required: false}
          - name: decks
            label: "Presentations (slide decks)"
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - {name: title, label: Title, widget: string}
              - {name: kicker, label: "Small label", widget: string, required: false}
              - name: slides
                label: Slides
                widget: list
                fields:
                  - {name: image, label: Slide, widget: image}
          - {name: instagram, label: "Instagram handle (shows live feed)", widget: string, required: false}
          - {name: photos_title, label: "Photo gallery title", widget: string, required: false}
          - name: photos
            label: "Photo gallery (masonry)"
            widget: list
            required: false
            collapsed: true
            fields:
              - {name: image, label: Image, widget: image}
              - {name: caption, label: Caption, widget: string, required: false}
              - {name: w, label: "Width (px)", widget: number, required: false}
              - {name: h, label: "Height (px)", widget: number, required: false}
          - name: press_teaser
            label: "Press teaser (Gleis//Garten)"
            widget: object
            required: false
            collapsed: true
            fields:
              - {name: link, label: Link, widget: string, required: false}
              - {name: label, label: "Button text", widget: string, required: false}
              - {name: count, label: "Number of cards", widget: number, required: false}
              - {name: source, label: "Press list file", widget: hidden, required: false}
              - {name: heading, label: "Intro line", widget: text, required: false}
          - name: site_teaser
            label: "Website teaser"
            widget: object
            required: false
            collapsed: true
            fields:
              - {name: image, label: "Full-page screenshot", widget: image, required: false}
              - {name: url, label: URL, widget: string, required: false}
              - {name: display, label: "Address shown", widget: string, required: false}
              - {name: label, label: "Button text", widget: string, required: false}
          - {name: reels_title, label: "Swipe video gallery title (optional)", widget: string, required: false}
          - name: reels
            label: "Swipe video gallery (vertical videos)"
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.video}}"
            fields:
              - {name: video, label: "Video (mp4)", widget: file}
              - {name: poster, label: "Poster image", widget: image, required: false}
              - {name: caption, label: "Caption", widget: string, required: false}
          - {name: fest_heading, label: "Highlight: heading (optional)", widget: string, required: false}
          - {name: fest_text, label: "Highlight: text", widget: text, required: false}
          - name: fest_stats
            label: "Highlight: big numbers"
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.figure}} {{fields.label}}"
            fields:
              - {name: figure, label: "Number", widget: string}
              - {name: label, label: "Label", widget: string}
          - name: fest_video
            label: "Highlight: video"
            widget: object
            required: false
            collapsed: true
            fields:
              - {name: video, label: "Video (mp4)", widget: file, required: false}
              - {name: poster, label: "Poster image", widget: image, required: false}
              - {name: caption, label: "Caption", widget: string, required: false}
          - name: fest_chart
            label: "Highlight: bar chart"
            widget: object
            required: false
            collapsed: true
            fields:
              - {name: title, label: "Title", widget: string, required: false}
              - {name: note, label: "Footnote", widget: text, required: false}
              - name: bars
                label: "Bars"
                widget: list
                required: false
                summary: "{{fields.label}} {{fields.text}}"
                fields:
                  - {name: label, label: "Label", widget: string}
                  - {name: sub, label: "Sub-label", widget: string, required: false}
                  - {name: value, label: "Value (for bar height)", widget: number, value_type: float}
                  - {name: text, label: "Shown value", widget: string, required: false}
          - {name: fest_more_label, label: "Highlight: button text", widget: string, required: false}
          - {name: fest_gallery_title, label: "Highlight: gallery title", widget: string, required: false}
          - name: fest_gallery
            label: "Highlight: poster gallery"
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.caption}}"
            fields:
              - {name: image, label: Image, widget: image}
              - {name: caption, label: Caption, widget: string, required: false}
          - name: fest_report
            label: "Highlight: report"
            widget: object
            required: false
            collapsed: true
            fields:
              - {name: image, label: "Preview image", widget: image, required: false}
              - {name: pdf, label: "PDF", widget: file, required: false}
              - {name: caption, label: "Caption", widget: string, required: false}
          - {name: title, widget: hidden}
      - {name: tv_heading, label: "TV clips heading (German Kraft)", widget: text, required: false}
      - name: tv
        label: "TV clips (German Kraft)"
        label_singular: clip
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.channel}}: {{fields.title}}"
        fields:
          - {name: video, label: "Video (MP4)", widget: file, required: false}
          - {name: youtube, label: "…or YouTube video ID", widget: string, required: false}
          - {name: poster, label: "Still image", widget: image}
          - {name: channel, label: Channel, widget: string}
          - {name: title, label: Title, widget: string}
      - {name: labels_heading, label: "Labels heading (German Kraft; {n} = number of labels)", widget: text, required: false}
      - {name: labels_text, label: "Labels text", widget: text, required: false}
      - name: labels
        label: "Beer labels (German Kraft)"
        label_singular: label
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.name}}"
        fields:
          - {name: image, label: Label, widget: image}
          - {name: name, label: "Name, style", widget: string}
      - {name: bricks_heading, label: "Scroll story heading (Mayfair)", widget: string, required: false}
      - {name: bricks_counter, label: "Scroll story counter (0 = hide)", widget: number, value_type: int, required: false}
      - name: bricks
        label: "Scroll story steps (Mayfair)"
        label_singular: step
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.text}}"
        fields:
          - {name: image, label: Image, widget: image}
          - {name: text, label: Text, widget: text}
      - {name: card_name, label: "Short name on homepage card (optional)", widget: string, required: false}
      - name: facts
        label: "Key facts (one-pager projects)"
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.label}}"
        fields:
          - {name: label, label: Label, widget: string}
          - {name: value, label: Value, widget: string}
      - name: chapters
        label: "Story chapters (one-pager projects)"
        label_singular: chapter
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.label}}"
        fields:
          - {name: label, label: "Small label (e.g. 01 — The idea)", widget: string}
          - {name: heading, label: Heading, widget: text}
          - {name: text, label: Paragraphs, widget: list, field: {name: p, label: Paragraph, widget: text}}
          - {name: image, label: Image, widget: image, required: false}
          - {name: caption, label: Caption, widget: string, required: false}
      - {name: apps_label, label: "Applications label (one-pager)", widget: string, required: false}
      - {name: apps_heading, label: "Applications heading", widget: string, required: false}
      - {name: apps_text, label: "Applications text", widget: text, required: false}
      - name: applications
        label: "Applications gallery (one-pager)"
        label_singular: item
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.caption}}"
        fields:
          - {name: image, label: Image, widget: image}
          - {name: caption, label: Caption, widget: string, required: false}
      - name: details
        label: "Closing details (one-pager)"
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.label}}"
        fields:
          - {name: label, label: Label, widget: string}
          - {name: value, label: Value, widget: string}
          - {name: url, label: "Link (optional)", widget: string, required: false}
      - {name: template, widget: hidden}
      - {name: order, label: "Position on the site (1 = first)", widget: number, value_type: int}
      - {name: hidden, label: "Hide this project from the site", widget: boolean, default: false, required: false}
      - {name: background, label: "Page colour", widget: color, default: "#ffffff"}
      - {name: text_colour, label: "Text colour", widget: color, default: "#0b0b0b"}
      - {name: card, label: "Logo card colour (homepage)", widget: color, default: "#0b0b0b"}
      - {name: slug, widget: hidden}
      - {name: logo, widget: hidden}
      - {name: tile, widget: hidden}
